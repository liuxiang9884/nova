[log]
# Must in ["trace", "debug", "info", "warning", "error", "critial"]
log_level = "trace"
file_sink_name = "/tmp/nova.log"
console_sink_name = "nova.log"
json_console_sink_name = "nova.json"
json_file_sink_name = "/tmp/nova.json"
backend_thread_name = "log_demo"
backend_cpu_affinity = 5
format_pattern = "%(log_level_short_code)%(time) %(process_id):%(thread_id) %(file_name):%(caller_function):%(line_number)] %(message)"
timestamp_pattern = "%Y-%m-%d %H:%M:%S.%Qns"